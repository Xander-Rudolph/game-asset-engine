# ComfyUI + ComfyUI-3D-Pack — image generation and image→3D.
#
#   docker compose --profile comfy up -d          # connected (can download)
#   docker compose --profile comfy-local up -d    # offline, DNS blackholed
#
# Everything weight-shaped lives under ${MODELS_DIR} (see .env), including
# the 3D-Pack's own Checkpoints tree — the pack hardcodes that to a folder
# inside its node directory, so we mount over it.
x-comfyui-base: &comfyui-base
  build:
    context: .
    dockerfile: Dockerfile
  ports:
    - "8188:8188"
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    - PYOPENGL_PLATFORM=egl
    - HF_HOME=/app/models/.hf
    # Leave comfy-env isolation ON.  Turning it off (COMFY_ENV_ISOLATE=0) makes
    # UniRigLoadMesh re-scan input/3d per request, which is tempting — but then
    # UniRig imports into the MAIN environment and picks up its bpy 4.5.9, which
    # dies with `undefined symbol: rtcGetSceneTraversable` (Embree ABI mismatch).
    # The pixi env ships a bpy built to match.  See README on getting a mesh into
    # UniRigLoadMesh's list.
  volumes:
    - ${MODELS_DIR}:/app/models
    - ${MODELS_DIR}/3d_checkpoints:/app/custom_nodes/ComfyUI-3D-Pack/Checkpoints
    - ./output:/app/output
    - ./input:/app/input
    - ./custom_nodes:/app/custom_nodes
    - ./workflows:/app/user
    # UniRig's whole HOME, kept on the host.  comfy-env spreads itself across
    # $HOME/.ce (the pixi ENVIRONMENT, ~10GB) *and* $HOME/.pixi (the pixi BINARY
    # that runs it) — mounting only .ce survives a restart but not a
    # --force-recreate, which wipes .pixi and fails with
    # `FileNotFoundError: /app/.home/.pixi/bin/pixi`.  Mount the parent, not the
    # pieces.  NOT under custom_nodes/, where ComfyUI would try to import it.
    - ./.home:/app/.home
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  # Write as the invoking user, not root — see the Dockerfile note.
  user: "${PUID:-1000}:${PGID:-1000}"
  shm_size: '16g'
  restart: unless-stopped
  # No --lowvram: 3D-Pack keeps several pipelines resident and lowvram thrashes
  # them.  Normal VRAM handling is the default and current ComfyUI no longer
  # accepts an explicit --normalvram, so the flag is simply absent.
  # --disable-pinned-memory is not optional on a 32 GB host. ComfyUI pins up to
  # 90% of system RAM for weight offloading (comfy/model_management.py,
  # MAX_PINNED_MEMORY = ram * 0.90) and page-locked memory cannot be swapped, so
  # 28.6 GB is reserved and the kernel OOM-kills the server mid-sample the moment
  # a browser is also open. Seen on 2026-09-10: Qwen text-to-image died at
  # 22 GB RSS with "Out of memory: Killed process ... (python3)" in dmesg, one
  # image into a batch. --cache-none is the other half: the Qwen text encoder is
  # 7.9 GB and would otherwise still be resident when the 20 GB unet loads, and
  # a 16 GB card means most of that unet lives in host RAM. Caching it costs an
  # encoder reload per image and buys the headroom that stops the kill.
  # Drop both flags only on a host with far more RAM.
  command: python3 main.py --listen 0.0.0.0 --enable-manager --disable-pinned-memory --cache-none

services:
  # The preconfigured package: everything but the weights, already built.
  #
  #   docker compose --profile packaged up -d
  #
  # No source checkout, no clones, no post-install: the node packs are baked
  # at pinned commits with their patches applied and the Hunyuan TexGen
  # extension compiled, and the workflows are already in ComfyUI's sidebar.
  # The two mounts left are the two things an image cannot carry: ~200GB of
  # weights, and the output you want to keep. The container names any missing
  # weights on boot, and fetches them if ASSET_ENGINE_FETCH_MODELS=1.
  #
  # Deliberately NOT mounting custom_nodes or workflows: a bind mount replaces
  # the path rather than merging with it, so mounting an empty host directory
  # over the baked one is exactly how you get a server with no nodes in it.
  # Use the `comfy` profile when you want to edit node source on the host.
  comfyui-packaged:
    image: ${ASSET_ENGINE_IMAGE:-ghcr.io/xander-rudolph/game-asset-engine-comfy:latest}
    container_name: comfyui-packaged
    profiles: ["packaged"]
    ports:
      - "8188:8188"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYOPENGL_PLATFORM=egl
      - HF_HOME=/app/models/.hf
      - ASSET_ENGINE_FETCH_MODELS=${ASSET_ENGINE_FETCH_MODELS:-0}
    command: python3 main.py --listen 0.0.0.0 --enable-manager --disable-pinned-memory --cache-none
    volumes:
      - ${MODELS_DIR}:/app/models
      - ${MODELS_DIR}/3d_checkpoints:/app/custom_nodes/ComfyUI-3D-Pack/Checkpoints
      - ./output:/app/output
      - ./input:/app/input
      # UniRig's pixi environment, which is ~11GB and is built on first use.
      # A named volume rather than a bind mount: nothing on the host needs to
      # read it, and it survives `down` and `--force-recreate` alike.
      - unirig-home:/app/.home
      # ComfyUI's user dir. Without this a graph you craft in the editor and
      # save lives only in the container's writable layer, and the next
      # `--force-recreate` throws it away. The entrypoint seeds this from the
      # image's own copy the first time, so it starts full rather than empty.
      - comfy-user:/app/user
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    user: "${PUID:-1000}:${PGID:-1000}"
    shm_size: '16g'
    restart: unless-stopped

  comfyui:
    <<: *comfyui-base
    container_name: comfyui
    profiles: ["comfy"]

  comfyui-local:
    <<: *comfyui-base
    container_name: comfyui-local
    profiles: ["comfy-local"]
    dns: 0.0.0.0

  # The MCP server: this repo's pipeline, served to an MCP client.
  #
  #   docker compose --profile mcp up -d      # HTTP, on 127.0.0.1:8765 only
  #
  # Its own profile, so it starts with none of the pipeline profiles. `packaged`,
  # `comfy` and `comfy-local` are unchanged by its presence: a service in a
  # profile starts only when that profile is named.
  #
  # THE DOCKER SOCKET BELOW IS ROOT ON THE HOST. Anything that can talk to it can
  # start a container that mounts / as root, so the uid this service runs as
  # bounds nothing. It is mounted anyway, and on purpose: the Blender tools work
  # by running `docker exec` against the ComfyUI container, and without the
  # socket the server serves the ComfyUI graphs and not much else. The port is
  # published on 127.0.0.1 and not 0.0.0.0 for the same reason, and that is not a
  # detail to "fix" later: a server on 0.0.0.0 here hands the host to the LAN.
  #
  # Stdio, for a client that starts the server itself, is a `docker run` rather
  # than a compose service; see mcp/README.md. Compose is for the shared HTTP one.
  asset-engine-mcp:
    build:
      # ./mcp, not the repo root: the image copies nothing, so a context of the
      # repo would tar output/ and input/ on every build for no reason.
      context: ./mcp
      dockerfile: Dockerfile
    image: ${ASSET_ENGINE_MCP_IMAGE:-asset-engine-mcp:dev}
    container_name: asset-engine-mcp
    profiles: ["mcp"]
    # No argument at all would speak MCP over stdin and stdout, which a
    # detached container has nobody to speak to. ENTRYPOINT is the server, so
    # these are appended to it.
    #
    # `--host 0.0.0.0` is NOT the loosening it looks like, and removing it
    # breaks the service. The server binds 127.0.0.1 by default, which inside a
    # container is the CONTAINER's loopback: a published port reaches the
    # container's external address and nothing is listening there, so every
    # request is refused (measured 2026-09-19: with the default bind, a POST to
    # the published port returns nothing at all, while the container's own log
    # says `http on 127.0.0.1:8765`). What keeps this private is the ports entry
    # below, which publishes on 127.0.0.1 alone. The server logs a warning about
    # binding off-loopback; here it means "reachable from this host's loopback
    # and from containers on this compose network", not "reachable from the
    # network".
    command: ["--http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      # 127.0.0.1 is load-bearing. See the note above.
      - "127.0.0.1:8765:8765"
    environment:
      # The three the server reads. ASSET_ENGINE_ROOT matches the mount below,
      # which is also the path the repo has on the host, so a path in a tool call
      # means the same thing on both sides of the socket.
      - ASSET_ENGINE_ROOT=/asset-engine
      - MODELS_DIR=/models
      # Empty unless you set it: scripts/_engine.py then asks `docker ps` which
      # ComfyUI container is up, which is the behaviour you want. Set it when
      # several are running and you mean a particular one.
      - ASSET_ENGINE_CONTAINER=${ASSET_ENGINE_CONTAINER:-}
      # Not optional, and not a default anyone would guess. Every script here
      # reads COMFY_URL and falls back to http://127.0.0.1:8188, which inside a
      # container is the CONTAINER's own loopback, not the host's: the fallback
      # finds nothing and the failure reads as "nothing answering at
      # http://127.0.0.1:8188", as if ComfyUI were down. host.docker.internal is
      # the host, via extra_hosts below. This assumes 8188 is published on an
      # address the container can route to, which is what the pipeline profiles
      # do today; the address that port is published on is an open owner
      # decision, so check this line if that changes.
      - COMFY_URL=${COMFY_URL:-http://host.docker.internal:8188}
    volumes:
      # The repo itself. Read-write, because the scripts write into output/, and
      # mounted rather than baked so that editing a script takes effect on the
      # next call instead of the next build.
      - .:/asset-engine
      # The weights, at the path ${MODELS_DIR} already resolves to from the repo
      # root, so a script that reads MODELS_DIR from .env and one that reads it
      # from the environment agree.
      - ${MODELS_DIR}:/models
      # The Docker socket: how scripts/_engine.py reaches ComfyUI and Blender.
      # Root on the host. See the note above.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Resolves host.docker.internal to the host from inside the default bridge
      # network, which Docker does not do by itself on Linux.
      - "host.docker.internal:host-gateway"
    # Write as the invoking user, exactly as the pipeline services do.
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      # The socket is root:docker 0660, so the uid above cannot open it without
      # docker's group as a supplementary gid. That gid is host-specific: 126 on
      # the reference machine (`stat -c '%g' /var/run/docker.sock`, 2026-09-19).
      # Put yours in .env as DOCKER_GID if it differs, or every tool that needs
      # the container fails with "permission denied while trying to connect to
      # the Docker daemon socket at unix:///var/run/docker.sock" (measured by
      # running the image's `docker ps` as uid 1000 with no group_add,
      # 2026-09-19).
      - "${DOCKER_GID:-126}"
    # The server spawns `docker exec` children and is PID 1 here. An init reaps
    # them and passes signals on, so a stopped container does not leave a Blender
    # job running in the ComfyUI container.
    init: true
    restart: unless-stopped

volumes:
  unirig-home:
  comfy-user:
